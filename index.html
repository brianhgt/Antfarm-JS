<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Antfarm JS</title>
<link rel="stylesheet" href="main.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
  }
}
</script>
<script src="//cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js">
</script>
</head>
<body>
<div id="appShell">
  <aside id="uiColumn">
    <h3>🐜 Antfarm JS 🐜</h3>

    <div id="miniMapPanel" style="display: none;">
      <canvas id="miniMap" width="160" height="80"></canvas>
    </div>

    <div id="controlPanel">
      <button id="viewToggle">📡</button>
      <button id="btn2">⚙️</button>
      <button id="btn3">➖</button>
      <button id="btn4">➕</button>
      <button id="btn5">3D</button>
       <button id="btnScenario">📊</button>
    </div>

    <div id="optionsPanel">
      <div id="panelHeader">
        <span>⚙️</span>
      </div>
      <div id="panelContent">
        <div class="option-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showPathsCheck">
            Show Paths
          </label>
        </div>

        <div class="option-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showEvaluationsCheck">
            Show Evaluations
          </label>
        </div>

        <div class="option-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showMiniMapCheck">
            Show Mini-map
          </label>
        </div>

        <div class="option-group">
          <label>Pheromones</label>
          <div class="toggle-button-row">
            <button type="button" id="trailPheromoneBtn" class="toggle-btn active">Trail</button>
            <button type="button" id="footprintPheromoneBtn" class="toggle-btn active">Footprint</button>
            <button type="button" id="alarmPheromoneBtn" class="toggle-btn active">Alarm</button>
          </div>
        </div>

        <div class="option-group">
          <label>Max Entities: <span id="maxEntitiesValue">2000</span></label>
          <input type="range" id="maxEntitiesSlider" min="5" max="2000" value="2000" step="10">
        </div>

        <div class="option-group">
          <label>Num Spiders: <span id="numSpidersValue">1</span></label>
          <input type="range" id="numSpidersSlider" min="0" max="10" value="1" step="1">
        </div>

        <div class="option-group">
          <label>Food Per Spawn: <span id="foodAmountValue">0</span></label>
          <input type="range" id="foodAmountSlider" min="0" max="50" value="0" step="1">
        </div>

        <div class="option-group">
          <label>Food Frequency: <span id="foodFrequencyValue">20</span></label>
          <input type="range" id="foodFrequencySlider" min="1" max="60" value="20" step="1">
          <div class="option-value">seconds: <span id="foodFrequencySecs">20.0</span></div>
        </div>

        <div class="option-group">
          <label>Food Clumps / spawn: <span id="foodClumpAmountValue">1</span></label>
          <input type="range" id="foodClumpAmountSlider" min="0" max="10" value="1" step="1">
        </div>

        <div class="option-group">
          <label>Food Clump Size: <span id="foodClumpSizeValue">20</span></label>
          <input type="range" id="foodClumpSizeSlider" min="1" max="100" value="20" step="1">
        </div>

        <div class="option-group">
          <label>Food Clump Radius: <span id="foodClumpRadiusValue">3</span></label>
          <input type="range" id="foodClumpRadiusSlider" min="1" max="50" value="3" step="1">
        </div>

        <div class="option-group">
          <label>Food Clump Frequency: <span id="foodClumpFrequencyValue">200</span></label>
          <input type="range" id="foodClumpFrequencySlider" min="1" max="500" value="200" step="1">
          <div class="option-value">seconds: <span id="foodClumpFrequencySecs">200.0</span></div>
        </div>

        <div class="option-group">
          <label>Physics Steps / sec: <span id="physicsHzValue">120</span></label>
          <input type="range" id="physicsHzSlider" min="30" max="240" value="120" step="1">
        </div>

        <div class="option-group">
          <label>Max Steps / frame: <span id="maxStepsValue">8</span></label>
          <input type="range" id="maxStepsSlider" min="1" max="32" value="8" step="1">
        </div>

        <div id="panelStats">
          <div class="stats-row">FPS: <span id="fpsStat">0</span></div>
          <div class="stats-row">Zoom: <span id="zoomStat">100%</span></div>
          <div class="stats-row">Ants: <span id="antsStat">0</span></div>
          <div class="stats-row">Ant Deaths: <span id="antDeathsStat">0</span></div>
          <div class="stats-row">Workers: <span id="workersStat">0</span></div>
          <div class="stats-row">Soldiers: <span id="soldiersStat">0</span></div>
          <div class="stats-row">Spiders: <span id="spidersStat">0</span></div>
          <div class="stats-row">Food: <span id="foodStat">0</span></div>
          <div class="stats-row">Steps/s: <span id="stepsStat">120</span></div>
        </div>
      </div>
    </div>
    
      <div id="scenariosPanel">
        <div id="scenarioHeader">
          <span>📊 Scenarios</span>
        </div>
        <div id="scenarioContent">
          <div class="option-group">
            <label>Seed (optional)</label>
            <input type="text" id="scenarioSeedInput" placeholder="Use current seed">
          </div>

          <div class="option-group">
            <label>Scenario</label>
            <select id="scenarioSelect">
              <option value="custom" selected>Custom Mix</option>
              <option value="soldier-vs-spider">Soldiers vs Spider</option>
              <option value="only-2">Only 2 Ants (No Spiders)</option>
            </select>
          </div>

          <div class="option-group">
            <label>Ants / Colony (worker+forager)</label>
            <input type="number" id="scenarioAntsInput" min="0" max="500" value="2" step="1">
          </div>

          <div class="option-group">
            <label>Soldiers / Colony</label>
            <input type="number" id="scenarioSoldiersInput" min="0" max="500" value="0" step="1">
          </div>

          <div class="option-group">
            <label>Colonies</label>
            <input type="number" id="scenarioColoniesInput" min="0" max="8" value="1" step="1">
          </div>

          <div class="option-group">
            <label>Spiders</label>
            <input type="number" id="scenarioSpidersInput" min="0" max="20" value="0" step="1">
          </div>

          <div class="option-group">
            <label>Food Distance From Nest</label>
            <input type="number" id="scenarioFoodDistanceInput" min="4" max="120" value="60" step="1">
          </div>

          <div class="option-group">
            <button type="button" id="launchScenarioBtn" class="toggle-btn">Launch Scenario</button>
          </div>
        </div>
      </div>
  </aside>

  <main id="viewportPanel">
    <canvas id="bg" class="gameCanvas"></canvas>
    <canvas id="fg" class="gameCanvas"></canvas>
    <canvas id="dbg" class="gameCanvas"></canvas>
  </main>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
